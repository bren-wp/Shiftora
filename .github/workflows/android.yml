name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Hosted Ubuntu Android images already include the required SDK platform.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Compile UI instrumentation tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest
      - name: Android lint
        run: ./gradlew --no-daemon :app:lintDebug
      - name: Debug APK and unsigned AAB
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shiftora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: shiftora-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
