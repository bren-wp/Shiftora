name: Android CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shiftora-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$MANAGER"
          "$MANAGER" --install 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest
      - name: Compile UI instrumentation tests
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest
      - name: Android lint (debug and release)
        run: ./gradlew --no-daemon :app:lintDebug :app:lintRelease
      - name: Debug APK and unsigned AAB
        run: ./gradlew --no-daemon :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: shiftora-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: shiftora-unsigned-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
