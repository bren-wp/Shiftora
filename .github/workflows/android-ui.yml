name: Android UI smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-ui.yml'
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Enable KVM for emulator
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' > /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            gradle --no-daemon :app:connectedDebugAndroidTest
            adb shell am start -n com.brendigo.shiftora/.MainActivity
            sleep 3
            adb exec-out screencap -p > shiftora-home-emulator.png
      - name: Attach emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftora-ui-screenshot
          path: shiftora-home-emulator.png
          if-no-files-found: ignore
