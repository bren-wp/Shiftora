name: Android UI smoke test
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-ui.yml'
      - 'app/src/main/java/com/brendigo/shiftora/ui/**'
      - 'app/src/main/java/com/brendigo/shiftora/MainActivity.kt'
      - 'app/src/androidTest/**'
      - 'app/src/main/java/com/brendigo/shiftora/data/**'
      - 'app/src/main/java/com/brendigo/shiftora/domain/**'
permissions:
  contents: write
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [pixel_2, pixel_4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android 16 compile SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$MANAGER"
          "$MANAGER" --install 'platforms;android-36'
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            ./gradlew --no-daemon :app:connectedDebugAndroidTest
            bash scripts/capture-emulator.sh ${{ matrix.profile }}
      - name: Attach emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shiftora-${{ matrix.profile }}-screenshots
          path: shiftora-${{ matrix.profile }}-*.png
          if-no-files-found: ignore
      - name: Update README gallery from actual Android screenshots
        if: ${{ success() && matrix.profile == 'pixel_4' && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shiftora-media"
          for screen in onboarding home calendar statistics salary more; do
            cp "shiftora-pixel_4-${screen}.png" "$RUNNER_TEMP/shiftora-media/${screen}.png"
          done
          git fetch origin readme-media
          git checkout -B readme-media origin/readme-media
          mkdir -p screenshots
          cp "$RUNNER_TEMP"/shiftora-media/*.png screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh real Shiftora emulator screenshots"
            git push origin HEAD:readme-media
          fi
