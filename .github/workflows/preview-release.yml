name: Shiftora preview release
on:
  workflow_run:
    workflows: ["Android CI"]
    types: [completed]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == 'bren-wp/Shiftora' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: guard
        name: Only release tested HEAD
        env:
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if test "$(git rev-parse HEAD)" = "$RUN_SHA"; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish verified preview assets
        if: steps.guard.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: bash scripts/publish-preview.sh "$RUN_ID" "${{ github.event.workflow_run.head_sha }}"
