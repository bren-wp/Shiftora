name: Google Play signed bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: google-play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$MANAGER"
          "$MANAGER" --install 'platforms;android-36'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate upload signing secrets
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.SHIFTORA_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_STORE_PASS: ${{ secrets.SHIFTORA_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.SHIFTORA_UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASS: ${{ secrets.SHIFTORA_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$UPLOAD_KEYSTORE_B64"
          test -n "$UPLOAD_STORE_PASS"
          test -n "$UPLOAD_KEY_ALIAS"
          test -n "$UPLOAD_KEY_PASS"
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shiftora-upload.jks"
          test -s "$RUNNER_TEMP/shiftora-upload.jks"
      - name: Build signed and optimized AAB/APK
        env:
          SHIFTORA_UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/shiftora-upload.jks
          SHIFTORA_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.SHIFTORA_UPLOAD_STORE_PASSWORD }}
          SHIFTORA_UPLOAD_KEY_ALIAS: ${{ secrets.SHIFTORA_UPLOAD_KEY_ALIAS }}
          SHIFTORA_UPLOAD_KEY_PASSWORD: ${{ secrets.SHIFTORA_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:bundleRelease :app:assembleRelease
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk
      - name: Upload signed Play packages
        uses: actions/upload-artifact@v4
        with:
          name: shiftora-play-signed-bundle-and-apk
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          retention-days: 7
          if-no-files-found: error
      - name: Destroy temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/shiftora-upload.jks"
